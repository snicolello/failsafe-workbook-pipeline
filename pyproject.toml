[project]
name = "failsafe-workbook-pipeline"
version = "0.1.0"
description = "Tab-level acceptance and source lineage for synthetic Excel workbooks"
requires-python = ">=3.11"
dependencies = [
    "duckdb==2.0.0",
    "openpyxl==3.1.5",
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pillow==13.0.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
